<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>Kickball</title>
  <defs>
    <radialGradient id="rubber" cx="36%" cy="28%" r="76%">
      <stop offset="0%" stop-color="#f2775f" />
      <stop offset="48%" stop-color="#d8412f" />
      <stop offset="100%" stop-color="#96261a" />
    </radialGradient>
  </defs>

  <circle cx="16" cy="16" r="15" fill="url(#rubber)" />

  <!-- The moulded grooves that wrap a playground ball. Bowing them all the
       same way is what reads as a sphere rather than a flat disc. -->
  <g fill="none" stroke="#7d1e13" stroke-opacity="0.5" stroke-width="1.6" stroke-linecap="round">
    <path d="M6.6 9.2 Q16 12.8 25.4 9.2" />
    <path d="M2.4 15.2 Q16 19.4 29.6 15.2" />
    <path d="M6.6 21.8 Q16 25.6 25.4 21.8" />
  </g>

  <ellipse cx="11.2" cy="9.6" rx="4.4" ry="2.9" fill="#fff" opacity="0.26"
           transform="rotate(-30 11.2 9.6)" />
</svg>
