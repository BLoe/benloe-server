<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="League Desk">
  <!-- The season tape: the app's signature mark. Wins above the line, losses below. -->
  <rect width="64" height="64" rx="12" fill="#0A0E13"/>
  <rect x="8" y="31" width="48" height="2" rx="1" fill="#2A3947"/>
  <g fill="#3FBF7F">
    <rect x="9"  y="18" width="7" height="13" rx="2"/>
    <rect x="19" y="23" width="7" height="8"  rx="2"/>
    <rect x="49" y="14" width="7" height="17" rx="2"/>
  </g>
  <g fill="#E5484D">
    <rect x="29" y="33" width="7" height="11" rx="2"/>
    <rect x="39" y="33" width="7" height="6"  rx="2"/>
  </g>
</svg>
