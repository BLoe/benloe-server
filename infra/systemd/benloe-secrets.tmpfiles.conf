# /run is tmpfs, so neither of these directories survives a reboot — which is
# the point for the rendered env, and harmless for the socket. benloe-secrets
# runs unprivileged and cannot mkdir in /run itself, so systemd-tmpfiles creates
# them early in boot with the ownership that IS the access control.
#
# Source of truth: infra/systemd/benloe-secrets.tmpfiles.conf
# Installed to:    /etc/tmpfiles.d/benloe-secrets.conf   (root:root)
# After editing:   cp it across, then `systemd-tmpfiles --create`.
#
# WHY TWO DIRECTORIES AND NOT ONE. This service publishes two things with
# exactly opposite audiences. The rendered env files must be unreachable by
# claude-worker — that uid is what the Cabinet agent's shells run as, and
# keeping the plaintext away from it is the entire reason this service exists.
# The broker socket must be REACHABLE by claude-worker, because Cabinet is its
# only client. One directory would have to be both traversable and not
# traversable by the same uid. So the two live apart and each mode below says
# one unambiguous thing.

# Rendered env — mode 0700: readable by this uid and by root (which every
# consuming service already is). No other uid on the box can traverse in.
d /run/benloe-secrets 0700 benloe-secrets benloe-secrets -

# Broker socket — mode 2750: the broker owns it, claude-worker (Cabinet) may
# traverse it, nobody else gets in.
#
# The setgid bit is load-bearing. The service runs unprivileged and therefore
# cannot chown its own socket into the claude-worker group (an unprivileged
# process may only chgrp to a group it belongs to, and putting benloe-secrets
# in claude-worker's group would hand it the wrong access in the other
# direction). setgid makes the socket INHERIT group claude-worker from this
# directory at bind() time, so a plain chmod 0660 is then enough. index.ts
# checks the resulting group and refuses to serve if it is not claude-worker.
d /run/benloe-secrets-broker 2750 benloe-secrets claude-worker -
