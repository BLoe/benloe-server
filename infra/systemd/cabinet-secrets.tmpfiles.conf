# /run is tmpfs, so the broker's socket directory does not survive a reboot.
# cabinet-secrets runs unprivileged and cannot mkdir in /run itself, so
# systemd-tmpfiles creates it early in boot with the ownership that IS the
# access control: the broker owns it, claude-worker (Cabinet) may traverse it,
# nobody else gets in.
#
# Source of truth: infra/systemd/cabinet-secrets.tmpfiles.conf
# Installed to:    /etc/tmpfiles.d/cabinet-secrets.conf   (root:root)
# After editing:   cp it across, then `systemd-tmpfiles --create`.
#
# Mode 2750 — the setgid bit is load-bearing. The broker runs unprivileged and
# therefore cannot chown its own socket into the claude-worker group (an
# unprivileged process may only chgrp to a group it belongs to, and putting
# cabinet-secrets in claude-worker's group would hand it the wrong access in
# the other direction). setgid makes the socket INHERIT group claude-worker
# from this directory at bind() time, so a plain chmod 0660 is then enough.
d /run/cabinet-secrets 2750 cabinet-secrets claude-worker -
